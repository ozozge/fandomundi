  <title>Mascots – Fandomundi</title>
  <meta name="description" content="Meet the mascots of Domundi couples — like Nongzon, the little one of Zee and Nunew." />

  <style>
    :root {
      --orange: #D46A1F;
      --orange-bright: #f26a00;
      --black: #1a1008;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1a1008 60%, #D46A1F 100%);
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
    }

    /* ── PAGE HEADER ── */
    .mascots-header {
      padding: 60px 60px 30px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .mascots-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 90px;
      color: var(--orange);
      letter-spacing: 4px;
      line-height: 1;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .mascots-header p {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      letter-spacing: 1px;
      max-width: 620px;
      line-height: 1.6;
    }

    /* ── SEARCH ── */
    .tools-wrap {
      padding: 24px 60px 0;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      fill: none;
      stroke: rgba(255,255,255,0.4);
      stroke-width: 2;
      stroke-linecap: round;
      pointer-events: none;
    }

    #mascotSearch {
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      padding: 7px 14px 7px 34px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: #fff;
      width: 240px;
      outline: none;
      transition: border-color 0.18s;
    }

    #mascotSearch::placeholder { color: rgba(255,255,255,0.35); }
    #mascotSearch:focus { border-color: var(--orange); }

    .results-count {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
    }

    /* ── GRID ── */
    .mascot-grid {
      padding: 28px 60px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* ── CARD ── */
    .mascot-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.2s;
    }

    .mascot-card:hover {
      border-color: var(--orange);
      transform: translateY(-3px);
    }

    /* family tree area */
    .family {
      position: relative;
      padding: 22px 20px 0;
      background: radial-gradient(circle at 50% 75%, rgba(212,106,31,0.35), transparent 65%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .parents {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .parent {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 64px;
    }

    .parent-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--orange);
      background: rgba(0,0,0,0.35);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--orange);
      letter-spacing: 1px;
    }

    .parent-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .parent-name {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.8);
      text-align: center;
    }

    .heart {
      color: var(--orange);
      font-size: 16px;
      margin-bottom: 18px;
    }

    /* line from parents down to mascot */
    .branch {
      width: 2px;
      height: 18px;
      background: linear-gradient(var(--orange), rgba(212,106,31,0.2));
      margin-top: -10px;
    }

    .mascot-img-wrap {
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mascot-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.45));
      transition: transform 0.3s;
    }

    .mascot-card:hover .mascot-img-wrap img {
      transform: scale(1.05) rotate(-2deg);
    }

    .mascot-placeholder {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }

    /* text area */
    .mascot-body {
      padding: 14px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      text-align: center;
    }

    .mascot-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1;
    }

    .mascot-kin {
      font-size: 12px;
      letter-spacing: 0.5px;
      color: var(--orange);
      font-weight: 700;
      margin-top: -4px;
      text-decoration: none;
      align-self: center;
      transition: color 0.15s;
    }

    .mascot-kin:hover { color: var(--orange-bright); }

    .mascot-about {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      line-height: 1.55;
    }

    .mascot-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .fact-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.75);
    }

    .fact-pill span {
      color: rgba(255,255,255,0.4);
      font-weight: 400;
      margin-right: 4px;
    }

    .mascot-links {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 12px;
      margin-top: auto;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .mascot-link {
      font-size: 11px;
      font-weight: 700;
      color: var(--orange);
      text-decoration: none;
      transition: color 0.15s;
    }

    .mascot-link:hover { color: var(--orange-bright); }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.3);
      font-size: 15px;
    }

    .no-results strong {
      display: block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: rgba(255,255,255,0.15);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 720px) {
      .mascots-header { padding: 30px 16px 16px; }
      .mascots-header h1 { font-size: 52px; }
      .tools-wrap { padding: 16px 16px 0; }
      .search-wrap, #mascotSearch { width: 100%; }
      .mascot-grid {
        grid-template-columns: 1fr;
        padding: 16px 16px 40px;
        gap: 16px;
      }
      .mascot-img-wrap { width: 150px; height: 150px; }
    }

    // ─────────────────────────────────────────────
    // RENDER
    // ─────────────────────────────────────────────
    function initials(name) {
      return name.slice(0, 2).toUpperCase();
    }

    function parentHTML(p) {
      const avatar = p.img
        ? `<img src="${p.img}" alt="${p.name}" onerror="this.parentElement.textContent='${initials(p.name)}'" />`
        : initials(p.name);
      return `
        <div class="parent">
          <div class="parent-avatar">${avatar}</div>
          <div class="parent-name">${p.name}</div>
        </div>`;
    }

    function buildCard(m) {
      const parents = m.parents || [];
      const facts = m.facts || [];
      const links = m.links || [];

      const parentsRow = parents
        .map(parentHTML)
        .join('<div class="heart">♥</div>');

      const factsHTML = facts.length
        ? `<div class="mascot-facts">${facts.map(f =>
            `<span class="fact-pill"><span>${f.label}</span>${f.value}</span>`
          ).join('')}</div>`
        : '';

      const linksHTML = links.length
        ? `<div class="mascot-links">${links.map(l =>
            `<a href="${l.url}" target="_blank" class="mascot-link">${l.label} ↗</a>`
          ).join('')}</div>`
        : '';

      const handle = (m.twitter || '').replace(/^@/, '').trim();

      return `
        <div class="mascot-card">
          <div class="family">
            <div class="parents">${parentsRow}</div>
            <div class="branch"></div>
            <div class="mascot-img-wrap">
              <img src="${m.image}" alt="${m.name}" onerror="this.parentElement.innerHTML='<div class=\\'mascot-placeholder\\'>No image yet</div>'" />
            </div>
          </div>
          <div class="mascot-body">
            <div class="mascot-name">${m.name}</div>
            ${handle ? `<a class="mascot-kin" href="https://x.com/${handle}" target="_blank">@${handle}</a>` : ''}
            ${m.about ? `<div class="mascot-about">${m.about}</div>` : ''}
            ${factsHTML}
            ${linksHTML}
          </div>
        </div>`;
    }

    function render() {
      const query = document.getElementById('mascotSearch').value.trim().toLowerCase();
      const grid = document.getElementById('mascotGrid');

      const filtered = mascots.filter(m => {
        const haystack = [m.name, ...(m.parents || []).map(p => p.name)].join(' ').toLowerCase();
        return !query || haystack.includes(query);
      });

      grid.innerHTML = filtered.length
        ? filtered.map(buildCard).join('')
        : `<div class="no-results"><strong>No results</strong>Try a different mascot or artist name</div>`;

      document.getElementById('resultsCount').textContent =
        filtered.length === mascots.length
          ? `${mascots.length} mascot${mascots.length === 1 ? '' : 's'}`
          : `${filtered.length} of ${mascots.length} mascots`;
    }

    document.getElementById('mascotSearch').addEventListener('input', render);
    render();
  </script>
