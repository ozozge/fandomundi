  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOMUNDI TV Staff | Managers &amp; Their Artists | Fandomundi</title>
  <meta name="description" content="Meet the DOMUNDI TV staff behind the artists: their Instagram and X accounts, and which artists each one works with." />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .staff-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    .staff-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      color: #D46A1F;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .staff-subtitle {
      color: #f0d8c0;
      font-size: 15px;
      margin-bottom: 50px;
      opacity: 0.7;
    }

    .staff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 20px;
    }

    .staff-card {
      background: rgba(255,248,240,0.06);
      border: 1px solid rgba(240,216,192,0.2);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      transition: border-color 0.2s, background 0.2s;
    }

    .staff-card:hover {
      border-color: #D46A1F;
      background: rgba(212,106,31,0.08);
    }

    /* Left side: staff photo + socials */
    .staff-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 170px;
      flex-shrink: 0;
    }

    .staff-photo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #D46A1F;
      background: #2a1d15;
    }

    .staff-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #D46A1F;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      color: #fff;
    }

    .staff-socials {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .staff-social-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f0d8c0;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.2s;
      word-break: break-all;
    }

    .staff-social-link:hover {
      color: #D46A1F;
    }

    .staff-social-link svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .social-platform {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(240,216,192,0.4);
      margin-bottom: 2px;
    }

    /* Right side: artists they handle */
    .staff-artists {
      flex: 1;
      min-width: 0;
      border-left: 1px solid rgba(240,216,192,0.15);
      padding-left: 20px;
    }

    .staff-artists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .artist-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #f0d8c0;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      transition: color 0.2s;
    }

    .artist-chip img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 2px solid rgba(240,216,192,0.25);
      transition: border-color 0.2s, transform 0.2s;
    }

    .artist-chip:hover {
      color: #D46A1F;
    }

    .artist-chip:hover img {
      border-color: #D46A1F;
      transform: scale(1.05);
    }

    .no-artists {
      font-size: 12px;
      color: rgba(240,216,192,0.35);
      margin-top: 8px;
    }

    /* CEO card: centered on its own row above everyone else */
    .ceo-slot {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .ceo-card {
      border-color: #D46A1F;
      justify-content: center;
      padding: 28px 40px;
    }

    .ceo-card .staff-info {
      align-items: center;
      text-align: center;
      width: auto;
    }

    .ceo-card .staff-photo,
    .ceo-card .staff-avatar {
      width: 110px;
      height: 110px;
      font-size: 44px;
    }

    .ceo-card .staff-socials {
      align-items: center;
    }

    .staff-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      color: #f0d8c0;
      line-height: 1;
    }

    .staff-role {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #D46A1F;
    }

    .ceo-card .staff-role {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: none;
    }

    .shoutout-link {
      color: #D46A1F;
      font-weight: 700;
      text-decoration: none;
    }

    .shoutout-link:hover {
      text-decoration: underline;
    }

    .staff-note {
      font-size: 11px;
      font-style: italic;
      color: rgba(240,216,192,0.5);
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .staff-section { padding: 40px 16px; }
      .staff-grid { grid-template-columns: 1fr; }
      .staff-card { flex-direction: column; }
      .staff-info { width: 100%; }
      .staff-artists {
        border-left: none;
        border-top: 1px solid rgba(240,216,192,0.15);
        padding-left: 0;
        padding-top: 16px;
        width: 100%;
      }
    }
  </style>
</head>

  <main>
    <div class="staff-section">
      <h1 class="staff-title">Staff</h1>
      <p class="staff-subtitle">The people behind Domundi on social media! (Quick shout out to <a href="https://x.com/CantquitwithG7" target="_blank" rel="noopener" class="shoutout-link">@CantquitwithG7</a> for the AR list)</p>

      <div class="ceo-slot" id="ceoSlot"></div>
      <div class="staff-grid" id="staffGrid"></div>
    </div>
  </main>

  <script>
    /* =====================================================================
       EDIT HERE
       - photo:   file name inside the /staff folder (leave "" to show the
                  first letter of their handle instead)
       - ig / x / tt:  Instagram / X / TikTok handles WITHOUT the @
       - artists: names exactly as their files in /artists
                  (e.g. "Tle" -> artists/Tle.html)
       ===================================================================== */
    /* CEO: shown on his own at the top, centered */
    const CEO = { photo: "aof.png", ig: "aoftionz", x: "GoodMemoriesDMD", xLabel: "GoodMemoriesDMD", role: "CEO (aka papa of Domundi)", ceo: true, artists: [] };

    /* name: shown above their socials. note: small line under the artists (optional) */
    const STAFF = [
      // ---- AR managers ----
      { role: "AR", photo: "bobby.png",    ig: "bobbyize",          x: "Ize6",            artists: ["Tle", "FirstOne", "Nan"] },
      { role: "MUA", photo: "phuwanet.jpg", ig: "phuwanet_r", x: "phuwanet_r", artists: ["Tle", "FirstOne"] },
      { role: "AR", photo: "suoleang.png", ig: "suoleang",          x: "iLeang21",        tt: "suoleang",        artists: ["Zee", "Tommy", "Nunew"] },
      { role: "AR", photo: "nakan.jpg",     x: "nakanisnakan",    artists: ["Poppy", "Thomas", "Kong", "teetee", "Por"] },
      { role: "AR", photo: "ker.jpg",     ig: "eyeker.yu",         x: "kerdomundi",      tt: "kerdomundi",      artists: ["Tutor", "Yim", "Jamessu", "Ryujin", "Patji"] },
      { role: "AR", photo: "wabi.jpg",    ig: "create16",          x: "wabi_noni16",     tt: "alohananoni",     artists: ["Jimmy", "Auau", "Save"] },
      { role: "AR", photo: "waymay.jpg",  ig: "waymay_cl",         x: "waymay_cl",       artists: ["Gems", "Copper", "Fifa", "Phupha", "Reeonn", "Few", "Ton", "Teddy"] },
      { role: "AR", photo: "ron.jpg",     ig: "ronna.ron",         x: "ronna_ronnachai", artists: ["North", "Otto", "Porsche", "Phupha", "Wave", "Nick", "Thee"] },
      { role: "AR", photo: "minji.jpg",   ig: "na.minji___",        x: "naminji__",       artists: ["Latte", "Kim", "Ohm", "Net", "JJ"] },
      { role: "AR", photo: "fai.jpg",      ig: "faipunys", x: "faipunys",        artists: ["Max", "Nat", "Park"], note: "Back from maternity leave" },
      { role: "AR", photo: "chamook.png", ig: "_chamook_chamook_", x: "chamook1919",     tt: "Chamook1919",     artists: ["Mark", "Keng", "Namping", "Pung"] },
      { role:"Acting coach, director", photo: "vivi.jpg", ig: "deniceferoce",      x: "VivienneActing",   artists: [] },
      { role:"Acting coach,director", photo: "kla.jpg",  x: "klaryder92", ig:"klaryder",      artists: [] },
      // ---- Other staff ----
      
      { photo: "mali.jpg", ig: "ice_mali",                                 artists: [] },
      { role: "MUA", photo: "fae.jpg", ig: "fimmi.fae",                                artists: [] },
      { role: "MUA", photo: "mine.jpg", ig: "minensg.18",                               artists: [] },
      { role: "MUA", photo: "ninu.jpg", ig: "ninumpss_mua",                              artists: [] },
      { role: "producer", photo: "imay.jpg", ig: "imaypl3",                                  artists: [] },
      { role:"photographer",photo: "nami.jpg", ig: "tonnamii",          x: "tonnamii",         artists: [] },
      
      { photo: "thana.jpg",  x: "thanatopmakeup", ig: "thanatop.makeupb",  artists: [] },
      { photo: "bu.jpg",  x: "BMPURIMPHAT",      artists: [] },
      
      { role:"Dance Trainer, Choreographer, AR",photo: "bird.jpg", ig: "bird_krittin",   x: "birdcando",        artists: [] },
    ];

    /* Artist photo files whose names don't match the page name exactly */
    const ARTIST_PHOTO_OVERRIDES = {
      "Tle": "tlenew.png",
      "FirstOne": "Firstone.jpg",
    };

    /* How a name shows under the photo, when it differs from the file name */
    const ARTIST_DISPLAY_NAMES = {
      "teetee": "TeeTee",
      "Jamessu": "James",
      "Auau": "AuAu",
    };

    /* ===================================================================== */

    const IG_ICON = '<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>';
    const X_ICON = '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

    const TT_ICON = '<svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.1z"/></svg>';

    function artistPhoto(name) {
      return 'artists/' + (ARTIST_PHOTO_OVERRIDES[name] || name + '.jpg');
    }

    function buildCard(s) {
      const handle = s.ig || s.xLabel || s.x;
      const platforms = [s.ig && 'Instagram', s.x && 'X', s.tt && 'TikTok'].filter(Boolean).join(' · ');

      const photo = s.photo
        ? `<img class="staff-photo" src="staff/${s.photo}" alt="@${handle}" loading="lazy" />`
        : `<div class="staff-avatar">${(s.name || handle).replace(/^[^a-z0-9]+/i, '').charAt(0).toUpperCase()}</div>`;

      let links = '';
      if (s.ig) links += `<a href="https://instagram.com/${s.ig}" target="_blank" rel="noopener" class="staff-social-link">${IG_ICON}@${s.ig}</a>`;
      if (s.x)  links += `<a href="https://x.com/${s.x}" target="_blank" rel="noopener" class="staff-social-link">${X_ICON}@${s.xLabel || s.x}</a>`;
      if (s.tt) links += `<a href="https://www.tiktok.com/@${s.tt}" target="_blank" rel="noopener" class="staff-social-link">${TT_ICON}@${s.tt}</a>`;

      const artists = s.artists.length
        ? `<div class="staff-artists-grid">${s.artists.map(a => `
            <a class="artist-chip" href="artists/${a}.html">
              <img src="${artistPhoto(a)}" alt="${ARTIST_DISPLAY_NAMES[a] || a}" loading="lazy" />
              <span>${ARTIST_DISPLAY_NAMES[a] || a}</span>
            </a>`).join('')}</div>`
        : `<div class="no-artists">Coming soon</div>`;

      const name = s.name ? `<div class="staff-name">${s.name}</div>` : '';
      const role = s.role ? `<div class="staff-role">${s.role}</div>` : '';
      const note = s.note ? `<div class="staff-note">${s.note}</div>` : '';
      // No artists listed -> leave the right side of the card empty
      const artistsBlock = !s.artists.length ? '' : `
          <div class="staff-artists">
            <div class="social-platform">Artists</div>
            ${artists}
            ${note}
          </div>`;

      return `
        <div class="staff-card${s.ceo ? ' ceo-card' : ''}">
          <div class="staff-info">
            ${photo}
            ${name}
            ${role}
            <div class="staff-socials">
              <div class="social-platform">${platforms}</div>
              ${links}
            </div>
          </div>${artistsBlock}
        </div>`;
    }

    document.getElementById('ceoSlot').innerHTML = buildCard(CEO);
    document.getElementById('staffGrid').innerHTML = STAFF.map(buildCard).join('');
  </script>

</body>
